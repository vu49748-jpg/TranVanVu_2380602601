services:
  - type: web
    name: tranvanvu-2380602601-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tranvanvu-2380602601-db
          property: connectionString
      - key: EMAIL_TRANSPORT
        value: apps_script
      - key: GAS_WEBHOOK_URL
        sync: false
      - key: GAS_SHARED_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: tranvanvu
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: tranvanvu-2380602601-db
    plan: free
    databaseName: tranvanvu_attendance
    user: tranvanvu
